<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>piikki</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Shared household ledger for two people." />
    <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0a13" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!--
      Loading-screen styles live here, inline, so they apply before the CSS
      bundle has even downloaded. They're used twice: by the boot splash
      inside <app-root> below (visible until Angular bootstraps and replaces
      it) and by LoadingScreen (src/app/shared/ui/loading-screen.ts) while
      the ledger data is still loading — same look, so the hand-off is
      seamless. Colours mirror the tokens in styles.scss.
    -->
    <style>
      html { background: #f6f5fb; }
      @media (prefers-color-scheme: dark) { html { background: #0b0a13; } }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        color: #6e6a85;
        animation: loading-screen-in 240ms ease-out both;
      }
      .loading-screen--inline { min-height: 55vh; }
      .loading-screen__brand {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #7c6cf8 0%, #5b8def 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .loading-screen--inline .loading-screen__brand { display: none; }
      .loading-screen__dots { display: flex; gap: 8px; }
      .loading-screen__dots span {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, #7c6cf8 0%, #5b8def 100%);
        animation: loading-screen-bounce 1.1s ease-in-out infinite;
      }
      .loading-screen__dots span:nth-child(2) { animation-delay: 0.15s; }
      .loading-screen__dots span:nth-child(3) { animation-delay: 0.3s; }
      .loading-screen__label { font-size: 14px; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .loading-screen { color: #a49fc0; }
        .loading-screen__brand,
        .loading-screen__dots span { background-image: linear-gradient(135deg, #8b7cf9 0%, #4d9bf5 100%); }
      }
      @keyframes loading-screen-bounce {
        0%, 80%, 100% { transform: translateY(0) scale(0.75); opacity: 0.45; }
        40% { transform: translateY(-8px) scale(1); opacity: 1; }
      }
      @keyframes loading-screen-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-screen, .loading-screen__dots span { animation: none; }
        .loading-screen__dots span { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="loading-screen" role="status" aria-live="polite">
        <span class="loading-screen__brand">piikki</span>
        <span class="loading-screen__dots" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="loading-screen__label">Loading…</span>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
